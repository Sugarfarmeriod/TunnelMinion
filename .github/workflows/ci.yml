name: 持续集成

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install 3.11

      - name: 同步锁定的开发环境
        run: uv sync --locked --all-groups

      - name: 运行质量门禁
        run: uv run python scripts/quality.py all
